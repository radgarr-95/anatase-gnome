name: Build Custom Image

on:
  # Enable below to run on a schedule
  # schedule:
  #   - cron: '00 07 * * 1,3,5' # Monday, Wednesday, Friday at 07:00 UTC
  
  # Enable below to run this action when you push changes
  # push:
  #   branches: [master, main]

  # This allows you to manually run the action through the GitHub Actions UI
  workflow_dispatch:

env:
  # Customize the image name
  # It will be published at ghcr.io/<your-github-username>/IMAGE_NAME:latest
  IMAGE_NAME: anatase-gnome

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Rebuild when the base version or repository commit changes
      - name: Fetch image versions
        run: |
          base_image=$(grep -im1 '^[[:space:]]*FROM[[:space:]]' Containerfile | awk '{print $2}')
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest"

          version=$(skopeo inspect --no-tags "docker://$base_image" | \
            jq -er '.Labels["org.opencontainers.image.version"] | select(type == "string" and length > 0)')

          # Gracefully handle first-time builds where the image doesn't exist yet
          published_image=$(skopeo inspect --no-tags "docker://$image" 2>/dev/null || echo '{}')
          published_version=$(jq -r '.Labels["org.anatase.version"] // ""' <<< "$published_image")
          published_commit=$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' <<< "$published_image")

          {
            echo "IMAGE=$image"
            echo "ANATASE_VERSION=$version"
            echo "VERSION_MATCH=$([[ "$version" == "$published_version" ]] && echo true || echo false)"
            echo "COMMIT_MATCH=$([[ "$GITHUB_SHA" == "$published_commit" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Build and push
        # Only build on hash or version changes
        if: env.VERSION_MATCH != 'true' || env.COMMIT_MATCH != 'true'
        run: |
          podman build --pull=always --squash --file Containerfile \
            --label "org.anatase.version=$ANATASE_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" .
          podman push "$IMAGE"
